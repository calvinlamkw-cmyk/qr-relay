<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>LDPlayer ID 3 - Henry QR</title><script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0;padding:16px}.card{background:#1e293b;border-radius:16px;padding:24px;max-width:360px;width:100%;text-align:center}.qr-wrap{background:#fff;padding:14px;border-radius:12px;display:inline-block;margin:10px 0 16px}.stats{text-align:left;background:#0f172a;border-radius:10px;padding:12px 14px;line-height:1.65}.elapsed{color:#38bdf8;font-weight:700}.raw{margin-top:10px;font-size:0.75rem;color:#94a3b8;word-break:break-all}</style></head><body><div class="card"><div>LDPlayer ID 3</div><h1 id="acctTitle">Account: Henry</h1><div class="qr-wrap"><div id="qrcode"></div></div><div class="stats"><div>Account: <strong id="acctVal">Henry</strong></div><div>Captured At: <strong id="capVal">-</strong></div><div>Time Since Capture: <span class="elapsed" id="elapsedVal">0s</span></div></div><div class="raw" id="rawVal">Waiting...</div></div><script>let capturedMs=null,lastStr="";async function loadData(){try{const r=await fetch("./qr_meta.json?t="+Date.now(),{cache:"no-store"});if(!r.ok)return;const d=await r.json();const acct=d.account_name||"Henry";document.getElementById("acctTitle").textContent="Account: "+acct;document.getElementById("acctVal").textContent=acct;document.getElementById("capVal").textContent=d.captured_at_local||d.captured_at_utc||"-";document.getElementById("rawVal").textContent=d.decoded_qr_string||"";capturedMs=d.captured_epoch_ms?Number(d.captured_epoch_ms):(d.captured_at_utc?Date.parse(d.captured_at_utc):null);if(d.decoded_qr_string&&d.decoded_qr_string!==lastStr&&typeof QRCode!=="undefined"){lastStr=d.decoded_qr_string;const el=document.getElementById("qrcode");el.innerHTML="";new QRCode(el,{text:d.decoded_qr_string,width:210,height:210})}}catch(e){}}function tick(){document.getElementById("elapsedVal").textContent=capturedMs?(Math.max(0,Math.floor((Date.now()-capturedMs)/1000))+"s"):"-"}loadData();tick();setInterval(loadData,5000);setInterval(tick,1000);</script></body></html>
