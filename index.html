<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>QR Relay — Henry (ID 3)</title>
<style>
body { font-family: system-ui, -apple-system, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; display: flex; justify-content: center; }
.card { max-width: 420px; width: 100%; background: #1e293b; border-radius: 16px; padding: 20px; box-shadow: 0 10px 25px rgba(0,0,0,.35); text-align: center; }
h1 { font-size: 1.2rem; margin: 0 0 6px; }
.sub { color: #94a3b8; font-size: 0.9rem; margin-bottom: 16px; }
.qr-box { background: #ffffff; padding: 14px; border-radius: 12px; display: inline-block; margin-bottom: 16px; }
.qr-box img { max-width: 280px; width: 100%; height: auto; display: block; }
.timer-box { background: #0f172a; border-radius: 12px; padding: 14px; margin-bottom: 14px; }
.timer-label { font-size: 0.8rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.05em; }
.timer-val { font-size: 2rem; font-weight: 700; font-variant-numeric: tabular-nums; color: #38bdf8; margin-top: 4px; }
.meta { font-size: 0.82rem; color: #cbd5e1; margin-bottom: 14px; }
button { background: #2563eb; color: #fff; border: 0; border-radius: 10px; padding: 10px 18px; font-size: 0.95rem; font-weight: 600; cursor: pointer; }
button:active { transform: scale(0.98); }
</style>
</head>
<body>
<div class="card">
<h1>QR Relay — Henry (ID 3)</h1>
<div class="sub" id="acctSub">Henry (ID:3) • 180s refresh loop</div>
<div class="qr-box">
  <img id="qrImg" src="acct_4.png" alt="Latest QR Code" />
</div>
<div class="timer-box">
  <div class="timer-label">Time Since QR Taken</div>
  <div class="timer-val" id="elapsedTimer">00:00</div>
</div>
<div class="meta" id="captureTime">Captured: --</div>
<button id="refreshBtn" type="button">Refresh QR View</button>
</div>

<script>
let capturedMs = null;
const qrImg = document.getElementById("qrImg");
const elapsedEl = document.getElementById("elapsedTimer");
const capEl = document.getElementById("captureTime");
const subEl = document.getElementById("acctSub");

function formatDuration(sec) {
  const s = Math.max(0, Math.floor(sec));
  const mins = Math.floor(s / 60);
  const rem = s % 60;
  return String(mins).padStart(2, "0") + ":" + String(rem).padStart(2, "0");
}

async function loadQrAndMeta() {
  const bust = "t=" + Date.now();
  qrImg.src = "acct_4.png?" + bust;
  try {
    const res = await fetch("qr_meta.json?" + bust, { cache: "no-store" });
    if (res.ok) {
      const data = await res.json();
      if (data.account_label) subEl.textContent = data.account_label + " • 180s refresh loop";
      if (data.captured_utc) {
        const parsed = Date.parse(data.captured_utc);
        if (!Number.isNaN(parsed)) {
          capturedMs = parsed;
          capEl.textContent = "Captured: " + new Date(parsed).toLocaleTimeString();
          elapsedEl.textContent = formatDuration((Date.now() - capturedMs) / 1000);
        }
      }
    }
  } catch (_) {}
}

setInterval(() => {
  if (capturedMs !== null) {
    elapsedEl.textContent = formatDuration((Date.now() - capturedMs) / 1000);
  }
}, 1000);

document.getElementById("refreshBtn").addEventListener("click", loadQrAndMeta);
loadQrAndMeta();
setInterval(loadQrAndMeta, 15000);
</script>
</body>
</html>
