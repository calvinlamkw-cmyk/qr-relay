<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QR Relay</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #111; color: #f5f5f5; text-align: center; padding: 20px; }
    .card { background: #1e1e1e; border-radius: 12px; padding: 16px; margin: 16px auto; max-width: 340px; }
    img { width: 220px; height: 220px; object-fit: contain; background: #fff; padding: 8px; border-radius: 8px; }
    button { margin-top: 12px; padding: 10px 18px; font-size: 15px; border-radius: 8px; border: 0; cursor: pointer; }
  </style>
</head>
<body>
  <h2>GREEN QR Relay</h2>
  <div class="card">
    <div>Account 4</div>
    <img id="qr4" src="acct_4.png" alt="Account 4 QR" />
    <div><button onclick="refreshQr()">Refresh QR</button></div>
  </div>
  <script>
    function refreshQr() {
      document.getElementById("qr4").src = "acct_4.png?t=" + Date.now();
    }
    refreshQr();
  </script>
</body>
</html>
